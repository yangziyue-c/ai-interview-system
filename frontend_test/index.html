<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 模拟面试</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 页面视图容器（由 js/app.js 按 hash 路由渲染） -->
    <main id="view"></main>

    <!-- 底部固定 Tab 栏（仅大厅/个人中心两个主视图显示） -->
    <nav id="tabbar" class="hidden">
      <button class="tab-item" data-tab="hall">
        <span class="tab-icon">💼</span><span>模拟面试</span>
      </button>
      <button class="tab-item" data-tab="profile">
        <span class="tab-icon">👤</span><span>个人中心</span>
      </button>
    </nav>
  </div>

  <!-- 全局轻提示 -->
  <div id="toast" class="hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
